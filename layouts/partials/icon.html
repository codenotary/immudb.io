{{/* Inline Lucide-shaped glyphs, so nothing is fetched to draw a 16px mark.
     Call with (dict "name" "search" "class" "h-4 w-4").

     The <svg> tag is written once, with `class` interpolated through Go's normal
     attribute escaping. An earlier version assembled the attribute list with
     printf and emitted it through safeHTMLAttr, which switched that escaping off
     for the caller-supplied class — harmless while every caller passes a
     literal, and a silent sink the moment one does not. */}}
{{- $c := .class | default "h-4 w-4" -}}
{{- $filled := or (eq .name "github") (eq .name "twitter") -}}
<svg class="{{ $c }}" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"{{ if $filled }} fill="currentColor"{{ else }} fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"{{ end }}>
{{- if eq .name "search" -}}
<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
{{- else if eq .name "sun" -}}
<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
{{- else if eq .name "moon" -}}
<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
{{- else if eq .name "chevron-right" -}}
<path d="m9 18 6-6-6-6"/>
{{- else if eq .name "chevron-left" -}}
<path d="m15 18-6-6 6-6"/>
{{- else if eq .name "chevron-down" -}}
<path d="m6 9 6 6 6-6"/>
{{- else if eq .name "arrow-right" -}}
<path d="M5 12h14M12 5l7 7-7 7"/>
{{- else if eq .name "copy" -}}
<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16V4a2 2 0 0 1 2-2h10"/>
{{- else if eq .name "pencil" -}}
<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
{{- else if eq .name "info" -}}
<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
{{- else if eq .name "alert" -}}
<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/>
{{- else if eq .name "x" -}}
<path d="M18 6 6 18M6 6l12 12"/>
{{- else if eq .name "menu" -}}
<path d="M4 6h16M4 12h16M4 18h16"/>
{{- else if eq .name "github" -}}
<path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.96 0-1.32.47-2.39 1.24-3.23-.13-.3-.54-1.53.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.23 0 4.63-2.81 5.65-5.49 5.95.43.37.82 1.1.82 2.22v3.29c0 .32.21.7.82.58A12.01 12.01 0 0 0 24 12.5C24 5.87 18.63.5 12 .5Z"/>
{{- else if eq .name "twitter" -}}
<path d="M18.9 2H22l-7 8 8.2 12h-6.4l-5-7.3L6 22H2.9l7.5-8.6L2.5 2H9l4.5 6.7L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.5L17.8 20Z"/>
{{- else -}}
{{- /* A name with no branch used to render an invisible nothing; fail the build instead. */ -}}
{{- errorf "partials/icon.html: unknown icon name %q" .name -}}
{{- end -}}
</svg>
