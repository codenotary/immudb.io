{{ define "main" }}
<main id="content" class="flex-1 px-4 pb-6 pt-[26px] sm:px-8">
  <div class="flex gap-10">
    <article class="prose min-w-0 max-w-[820px] flex-1" data-pagefind-body>
      <h1>{{ .Title }}</h1>
      {{ .Content }}
      {{ partial "edit-link.html" . }}
      {{ partial "prev-next.html" . }}
    </article>
    {{ partial "toc.html" . }}
  </div>
</main>
{{ end }}
