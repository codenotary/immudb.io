version: 2

updates:
  # Site build and test tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Majors stay a human decision. VitePress 1.6.4 constrains vite to 5.x,
      # and vue-tsc 3 / @lhci/cli / babel 8 each need their own verification
      # pass, so an automated major bump here breaks the docs build rather than
      # securing it. Security advisories are unaffected by this -- they are
      # raised separately from version updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The 40 documentation code examples under src/code-examples/go/. Without the
  # wildcard directory and the group, each module opens its own PR for the same
  # advisory -- which is how the backlog reached 30 open PRs and 855 alerts.
  - package-ecosystem: gomod
    directories:
      - /src/code-examples/go/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-examples:
        patterns:
          - "*"
    ignore:
      # The immudb version an example pins is an editorial choice, not a
      # maintenance one -- it has to match the release the surrounding doc page
      # documents. embedded-kv (v1.4.1) and embedded-kv-v1.5.0 (v1.5.0) predate
      # the context.Context parameters on the embedded store API, so bumping
      # them breaks the build and misdocuments those pages. Bump this by hand
      # alongside a docs release; Dependabot still patches everything below it.
      - dependency-name: github.com/codenotary/immudb
